# Queue-driven autoscaling (requires KEDA: https://keda.sh).
# Adds a pod for every QUEUE_PER_POD messages waiting in invoice.jobs, so a bulk
# upload fans out across pods and idle capacity scales back down afterwards.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: invoiceai-rabbitmq
spec:
  secretTargetRef:
    - parameter: host
      name: invoiceai-secrets
      key: RABBITMQ_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: invoiceai-worker
spec:
  scaleTargetRef:
    name: invoiceai-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  # Keep pods around briefly so a follow-up burst doesn't pay the cold start again.
  cooldownPeriod: 300
  triggers:
    - type: rabbitmq
      authenticationRef:
        name: invoiceai-rabbitmq
      metadata:
        protocol: amqp
        queueName: invoice.jobs
        mode: QueueLength
        value: "2"
