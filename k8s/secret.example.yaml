# Copy to secret.yaml, fill in real values, and keep it out of git.
apiVersion: v1
kind: Secret
metadata:
  name: invoiceai-secrets
type: Opaque
stringData:
  RABBITMQ_URL: amqp://invoiceai:change-me@rabbitmq:5672/%2F
  GEMINI_API_KEY: your-gemini-api-key
  # Bucket the API uploads documents to (jobs carry only the object key).
  STORAGE_BUCKET: invoiceai-uploads
  AWS_REGION: us-east-1
  # Omit both keys when the pod gets credentials from IRSA / workload identity.
  AWS_ACCESS_KEY_ID: your-access-key-id
  AWS_SECRET_ACCESS_KEY: your-secret-access-key
