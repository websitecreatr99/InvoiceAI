name: API CI/CD

on:
  push:
    branches: [fastapi, main]
  pull_request:
    branches: [fastapi, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-api
  RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F

jobs:
  test:
    name: Unit + RabbitMQ integration tests
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  docker:
    name: Build, smoke test & publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/fastapi' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: invoiceai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The real worker image is tested on the worker branch; a fake one answers here.
      - name: Start fake worker
        run: |
          pip install pika==1.3.2
          nohup python scripts/fake_worker.py ci-worker > fake-worker.log 2>&1 &

      - name: Smoke test container (via RabbitMQ)
        run: bash scripts/smoke_test.sh invoiceai-api:ci 5000

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-container-log
          path: |
            smoke-container.log
            fake-worker.log
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layers come from the cache populated by the build step above.
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
